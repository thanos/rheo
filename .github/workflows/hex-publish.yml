name: Hex Publish

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "publish" to upload this commit to Hex'
        required: true
        type: string

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event.inputs.confirm == 'publish'

    services:
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.adminCommand(\"ping\")'"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      postgres:
        image: postgres:16
        ports:
          - 5432:5432
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: rheo_test
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      RHEO_MONGO_URL: mongodb://localhost:27017/rheo_test
      RHEO_POSTGRES_URL: ecto://postgres:postgres@localhost:5432/rheo_test
      RHEO_REDIS_URL: redis://localhost:6379

    steps:
      # Do not set fetch-tags: true on tag-push workflows. With fetch-depth: 1,
      # actions/checkout fetches `+SHA:refs/tags/vX` and also the annotated tag
      # object into the same ref → `Cannot fetch both … to refs/tags/vX` (exit 128).
      - uses: actions/checkout@v4

      - uses: erlef/setup-beam@v1
        with:
          elixir-version: "1.20.2"
          otp-version: "29.0.4"

      - name: Cache deps
        uses: actions/cache@v4
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-mix-${{ hashFiles('**/mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-mix-

      - name: Install dependencies
        run: mix deps.get

      # Do not use `mix run -e` here: Mix prints `==> dep` compile banners on
      # stdout, so VERSION becomes multiline junk and the compare always fails
      # on a cold cache (first seen on v0.12.0; assert itself is post-v0.11.0).
      - name: Assert tag matches mix.exs version
        run: |
          VERSION=$(sed -n 's/^[[:space:]]*@version[[:space:]]*"\([^"]*\)".*/\1/p' mix.exs | head -n1)
          if [ -z "$VERSION" ]; then
            echo "Could not read @version from mix.exs"
            exit 1
          fi
          if [ "${{ github.event_name }}" = "push" ]; then
            TAG="${{ github.ref_name }}"
          else
            git fetch --tags --force origin
            TAG=$(git describe --tags --exact-match)
          fi
          if [ "$TAG" != "v$VERSION" ]; then
            echo "Tag $TAG does not match mix.exs version v$VERSION"
            exit 1
          fi
          echo "OK: $TAG matches mix.exs $VERSION"

      - name: Verify
        run: mix ci

      # ex_doc is only: :dev — hex.publish builds docs and needs the default (dev) env.
      - name: Publish to Hex
        run: mix hex.publish --yes
        env:
          HEX_API_KEY: ${{ secrets.HEX_API_KEY }}
